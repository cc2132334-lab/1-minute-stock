name: 1-Min Morning Hunter Daily

on:
  schedule:
    # 03:47 UTC = 09:17 AM IST (Monday to Friday)
    - cron: '47 3 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pytz

      - name: Run 1-Min Morning Scanner
        run: python scanner.py
